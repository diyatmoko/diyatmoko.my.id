name: Portfolio CI & VPS
run-name: Portfolio ${{ inputs.operation || 'verify' }} · ${{ github.ref_name }}

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, deploy main to VPS, or restore the previous release
        type: choice
        required: true
        default: verify
        options: [verify, deploy, rollback]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_SITE_URL: ${{ vars.SITE_URL || 'https://diyatmoko.my.id' }}
  VITE_BASE_PATH: /

jobs:
  verify:
    if: inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:deployment
      - name: Test shared Nginx setup failure handling
        run: python3 -m unittest discover -s scripts -p 'test_domain_setup.py' -v
      - name: Build production bundle with release identity
        run: |
          npm run build
          printf '{"sha":"%s","repository":"%s","release_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > dist/release.json
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload static production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested build and matching Nginx headers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-runtime
          path: |
            dist/
            deploy/generated/nginx.conf
          if-no-files-found: error
          retention-days: 2
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTFOLIO_IMAGE: diyatmoko-portfolio:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      PORTFOLIO_BIND_PORT: '18080'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: portfolio-runtime
          path: .
      - name: Package the exact tested static build
        run: |
          docker build --file deploy/Dockerfile.runtime \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$PORTFOLIO_IMAGE" .
      - name: Verify non-root production container
        run: |
          docker compose -p diyatmoko-portfolio-vps -f deploy/compose.vps.yaml up -d --no-build --pull never --wait --wait-timeout 60
          curl --fail --silent --show-error http://127.0.0.1:18080/health.txt
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q 'Yanuar Diyatmoko'
          curl --fail --silent --show-error http://127.0.0.1:18080/release.json | grep -F "\"sha\":\"$GITHUB_SHA\""
          docker compose -p diyatmoko-portfolio-vps -f deploy/compose.vps.yaml exec -T portfolio nginx -t
          test "$(docker compose -p diyatmoko-portfolio-vps -f deploy/compose.vps.yaml exec -T portfolio id -u)" = "101"
      - name: Verify public HTTP HTTPS and ACME routing
        run: bash scripts/test-public-nginx.sh
      - name: Export validated image for SSH delivery
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') ||
          (github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true'))
        run: |
          mkdir release-image
          docker save "$PORTFOLIO_IMAGE" | gzip -1 > release-image/image.tar.gz
          cd release-image
          sha256sum image.tar.gz > image.tar.gz.sha256
      - name: Upload validated image
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') ||
          (github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-image
          path: release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Stop verification container
        if: always()
        run: |
          docker compose -p diyatmoko-portfolio-vps -f deploy/compose.vps.yaml logs --tail 40 || true
          docker compose -p diyatmoko-portfolio-vps -f deploy/compose.vps.yaml down

  deploy:
    needs: [verify, container]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback') ||
      (needs.verify.result == 'success' && needs.container.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') ||
      (github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://diyatmoko.my.id' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject superseded deployments
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'main has changed during verification. Run deployment for the current main commit.' >&2
            exit 1
          fi
      - name: Download validated image from this run
        if: inputs.operation != 'rollback'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: portfolio-image
          path: release-image/
      - name: Deploy or rollback over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
          OPERATION: ${{ inputs.operation == 'rollback' && 'rollback' || 'deploy' }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash scripts/github-vps.sh "$OPERATION" "$RELEASE_ID"
          printf 'VPS operation: **%s**\n\nWorkflow commit: `%s`\n\nLocal Nginx HTTP checks passed. Verify the public domain after its one-time TLS setup.\n' "$OPERATION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
